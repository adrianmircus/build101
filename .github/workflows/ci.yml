# Runs on every PR and on pushes to main (a push to a branch with an open PR would run it twice).
# A PR to main can only merge with both jobs green (branch protection).
# Supabase (local database, integration tests and pgTAP) joins in T1.1.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verificar:
    name: Verificar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Pruebas de unidad
        run: npm run test:coverage
      - name: Build
        run: npm run build

  punta-a-punta:
    name: Punta a punta
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Navegador de Playwright
        run: npx playwright install --with-deps chromium
      # playwright.config.ts builds and starts the app itself (webServer), without any AI key:
      # the demo runs on fixtures and the tests block every request that leaves localhost.
      - name: Playwright
        run: npm run test:e2e
      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
