# Corre en cada push y PR a main. En Vercel, "CI / Verificar" es un Deployment Check requerido:
# si falla, el deploy queda como preview y no se promueve a producción.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Verificar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Tests del adaptador
        run: npm run test:adapter
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
